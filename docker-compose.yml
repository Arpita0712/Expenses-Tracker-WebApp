version: "3.8"
services:
  mysql:
    image: mysql:latest
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: /run/secrets/mysql_password
      MYSQL_DATABASE: expenses_tracker
    secrets:
      - mysql_password
    volumes:
      - ./mysql-data:/var/lib/mysql
    networks:
      - appbridge
    healthcheck:
      test:
        - CMD-SHELL
        - 'MYSQL_PWD="$$(cat /run/secrets/mysql_password)" mysql -h 127.0.0.1 -uroot -e "SELECT 1" >/dev/null 2>&1'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always

  mainapp:
    image: snehcreate/expensetracker_v3
    container_name: Expensetracker
    environment:
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/expenses_tracker?allowPublicKeyRetrieval=true&useSSL=false"
      SPRING_CONFIG_IMPORT: "configtree:/run/secrets/"
    secrets:
      - source: mysql_password
        target: spring.datasource.password
    ports:
      - "8080:8080"
    networks:
      - appbridge
    depends_on:
      - mysql
    restart: always
    
secrets:
  mysql_password:
    file: ./secrets/mysql_password.txt

networks:
  appbridge:

volumes:
  mysql-data:
