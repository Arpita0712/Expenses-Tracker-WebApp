services:
  nginx:
    build: 
      context: ./nginx
    container_name: nginx
    networks:
      - three-tier-web
    ports: 
    - "80:80"
    depends_on:
      - expenses_tracker
    restart: always
  expenses_tracker:
    build:
      context: .
    container_name: expensesapp
    environment:
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Test@123
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/expenses_tracker?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
    networks:
      - three-tier-web
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "localhost:8080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  mysql:
    image: mysql
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: Test@123
      MYSQL_DATABASE: expenses_tracker
    networks:
      - three-tier-web
    ports:
      - "3306:3306"
    volumes: 
      - mysqlvolume:/var/lib/mysql
    restart: always
    healthcheck:
      test: ["CMD","mysqladmin","ping","-h","localhost","-uroot","-pTest@123"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysqlvolume:
networks:
  three-tier-web:
